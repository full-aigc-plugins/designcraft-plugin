schema: spec-driven
context: |
  本项目是 DesignCraft 插件本地候选，版本 0.1.0-dev.1，包含 designcraft-skills 的六项快照。
  规范、设计及任务使用中文；需求关键字 MUST/SHALL 与 Scenario 结构保留英文。
  插件拥有本地 Harness、来源锁、宿主接入和发行门禁；共享执行契约由 designcraft-skills 维护。
  不直接修改外部技能快照；共享修复先在技能源完成并经受控同步进入插件。
  原生安装、宿主发现、模型选用、创作验收和发行必须分别取得当前证据。
  优化变更已进入实施；离线代码与测试进度不代表原生、宿主、创作或发行验收通过。
rules:
  specs:
    - 每项 requirement 必须包含可观察行为和至少一个 WHEN/THEN 场景。
    - 引用技能源契约，不在插件内重复定义参数、安装器和执行回执格式。
  tasks:
    - 标明优先级、需求编号、验收证据和跨项目依赖；未实现任务保持未勾选。
